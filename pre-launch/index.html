  /* Decorative overlays */
  .sc-overlays { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .sc-grid {
    position: absolute; inset: 0; opacity: 0.5;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.035) 1px,transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(120% 90% at 50% 30%,#000 40%,transparent 85%);
    mask-image: radial-gradient(120% 90% at 50% 30%,#000 40%,transparent 85%);
  }
  .sc-hatch-1 {
    position: absolute; top: -60px; right: -40px; width: 520px; height: 340px;
    transform: rotate(-24deg);
    background: repeating-linear-gradient(90deg,rgba(225,6,0,0.14) 0 26px,transparent 26px 66px);
    -webkit-mask-image: linear-gradient(90deg,transparent,#000 60%);
    mask-image: linear-gradient(90deg,transparent,#000 60%);
  }
  .sc-hatch-2 {
    position: absolute; bottom: 20px; left: -80px; width: 480px; height: 280px;
    transform: rotate(-24deg);
    background: repeating-linear-gradient(90deg,rgba(255,255,255,0.05) 0 18px,transparent 18px 54px);
    -webkit-mask-image: linear-gradient(90deg,#000 40%,transparent);
    mask-image: linear-gradient(90deg,#000 40%,transparent);
  }
  .sc-streak { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg,transparent,rgba(255,82,71,0.9),transparent); }
  .sc-streak-1 { top: 34%; width: 38%; animation: scdln-streak 2.6s linear infinite; }
  .sc-streak-2 { top: 52%; width: 30%; height: 1px; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent); animation: scdln-streak 3.4s linear infinite 0.8s; }
  .sc-streak-3 { top: 66%; width: 34%; background: linear-gradient(90deg,transparent,rgba(255,82,71,0.7),transparent); animation: scdln-streak 3.0s linear infinite 1.6s; }

  .sc-topbar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #E10600; box-shadow: 0 0 24px rgba(225,6,0,0.55); z-index: 2; }

  /* Starting lights */
  .sc-lights-wrap { z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sc-lights-row { background: linear-gradient(#141417,#08080A); border: 1px solid rgba(255,255,255,0.10); border-radius: 8px; padding: 12px 14px; display: flex; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  .sc-lamp-cell { display: flex; padding: 7px 6px; background: #050506; border-radius: 5px; border: 1px solid rgba(255,255,255,0.06); }
  .scdln-lamp { position: relative; width: 30px; height: 30px; border-radius: 999px; background: radial-gradient(circle at 38% 32%, #2a0304 0%, #170203 70%, #0b0102 100%); box-shadow: inset 0 1px 2px rgba(255,255,255,0.12), inset 0 -2px 4px rgba(0,0,0,0.6); }
  .scdln-glow { position: absolute; inset: 0; border-radius: 999px; background: radial-gradient(circle at 38% 32%, #ffd9d5 0%, #ff3c32 26%, #b00500 72%, #6e0300 100%); box-shadow: 0 0 18px 2px rgba(225,6,0,0.9); opacity: 0; }
  .scdln-g1 { animation: scdln-g1 8s linear infinite; }
  .scdln-g2 { animation: scdln-g2 8s linear infinite; }
  .scdln-g3 { animation: scdln-g3 8s linear infinite; }
  .scdln-g4 { animation: scdln-g4 8s linear infinite; }
  .scdln-g5 { animation: scdln-g5 8s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .scdln-glow { animation: none !important; opacity: 1; } }
  @keyframes scdln-g1 { 0%,9.9%{opacity:0} 10%,74.9%{opacity:1} 75%,100%{opacity:0} }
  @keyframes scdln-g2 { 0%,19.9%{opacity:0} 20%,74.9%{opacity:1} 75%,100%{opacity:0} }
  @keyframes scdln-g3 { 0%,29.9%{opacity:0} 30%,74.9%{opacity:1} 75%,100%{opacity:0} }
  @keyframes scdln-g4 { 0%,39.9%{opacity:0} 40%,74.9%{opacity:1} 75%,100%{opacity:0} }
  @keyframes scdln-g5 { 0%,49.9%{opacity:0} 50%,74.9%{opacity:1} 75%,100%{opacity:0} }
  @keyframes scdln-sweep  { 0%{transform:translateX(-120%)} 100%{transform:translateX(250%)} }
  @keyframes scdln-blink  { 0%,45%{opacity:1} 50%,95%{opacity:0.25} 100%{opacity:1} }
  @keyframes scdln-streak { 0%{transform:translateX(-30%);opacity:0} 8%{opacity:0.5} 92%{opacity:0.5} 100%{transform:translateX(130%);opacity:0} }

  .sc-lights-caption { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #9A9AA6; }

  /* Title */
  .sc-title-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; z-index: 1; }
  .sc-eyebrow { font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: #FF5247; display: flex; align-items: center; gap: 10px; }
  .sc-eyebrow .sc-arrow { color: #E10600; }
  .sc-get-ready { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #9A9AA6; }
  .sc-wordmark { margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(3.2rem,9vw,6.5rem); line-height: 0.9; letter-spacing: -0.01em; text-transform: uppercase; display: flex; align-items: baseline; }
  .sc-wordmark .sc-06 { color: #E10600; text-shadow: 0 0 26px rgba(225,6,0,0.55); }
  .sc-live-heading { margin: 0; font-family: 'Anton', sans-serif; font-weight: 400; font-size: clamp(3rem,8vw,5.5rem); line-height: 0.9; letter-spacing: -0.01em; text-transform: uppercase; color: #E10600; text-shadow: 0 0 30px rgba(225,6,0,0.6); }
  .sc-tagline { font-family: 'Titillium Web', sans-serif; font-size: 15px; color: #C7C7D0; max-width: 40ch; }
  .sc-event-line { font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #9A9AA6; margin-top: 4px; }

  .sc-launch-caption { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #9A9AA6; z-index: 1; margin-bottom: -14px; }

  /* Countdown */
  .sc-countdown { display: flex; align-items: stretch; gap: 14px; z-index: 1; flex-wrap: wrap; justify-content: center; }
  .sc-cd-box {
    position: relative; min-width: 132px;
    background: #1C1C21; border: 1px solid rgba(255,255,255,0.10);
    border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    padding: 22px 18px 16px; display: flex; flex-direction: column;
    align-items: center; gap: 8px; overflow: hidden;
  }
  .sc-cd-box-top { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #E10600; }
  .sc-cd-box-sweep { position: absolute; top: 3px; left: 0; width: 40%; height: 3px; background: linear-gradient(90deg,rgba(255,255,255,0.7),transparent); animation: scdln-sweep 3.2s linear infinite; }
  .sc-cd-value { font-family: 'Anton', sans-serif; font-size: clamp(3rem,7vw,4.5rem); line-height: 0.9; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  .sc-cd-label { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #9A9AA6; }

  /* Status row */
  .sc-status { display: flex; align-items: center; gap: 22px; z-index: 1; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #9A9AA6; }
  .sc-status-dot { width: 9px; height: 9px; border-radius: 999px; background: #00C24A; box-shadow: 0 0 10px rgba(0,194,74,0.7); animation: scdln-blink 1.6s ease-in-out infinite; display: inline-block; }
  .sc-status-sep { color: #34343C; }
</style>
</head>
<body>

  <div class="sc-overlays" aria-hidden="true">
    <div class="sc-grid"></div>
    <div class="sc-hatch-1"></div>
    <div class="sc-hatch-2"></div>
    <div class="sc-streak sc-streak-1"></div>
    <div class="sc-streak sc-streak-2"></div>
    <div class="sc-streak sc-streak-3"></div>
  </div>

  <div class="sc-topbar"></div>

  <!-- Starting lights -->
  <div class="sc-lights-wrap">
    <div class="sc-lights-row">
      <div class="sc-lamp-cell"><div class="scdln-lamp"><div class="scdln-glow scdln-g1"></div></div></div>
      <div class="sc-lamp-cell"><div class="scdln-lamp"><div class="scdln-glow scdln-g2"></div></div></div>
      <div class="sc-lamp-cell"><div class="scdln-lamp"><div class="scdln-glow scdln-g3"></div></div></div>
      <div class="sc-lamp-cell"><div class="scdln-lamp"><div class="scdln-glow scdln-g4"></div></div></div>
      <div class="sc-lamp-cell"><div class="scdln-lamp"><div class="scdln-glow scdln-g5"></div></div></div>
    </div>
    <div class="sc-lights-caption">Lights out &amp; away we go</div>
  </div>

  <!-- Title -->
  <div class="sc-title-wrap">
    <div class="sc-eyebrow"><span class="sc-arrow">▸</span>WEBSITE LAUNCH COUNTDOWN</div>
    <div id="sc-title-live" style="display:none">
      <h1 class="sc-live-heading">We're live</h1>
    </div>
    <div id="sc-title-countdown">
      <div class="sc-get-ready">Get ready for</div>
      <h1 class="sc-wordmark"><span>STANDCON</span><span class="sc-06">06</span></h1>
    </div>
    <div class="sc-tagline">Explore every gap, exploit every lap.</div>
    <div class="sc-event-line">EVENT · 16 – 17 OCT 2026 · LIFELONG LEARNING INSTITUTE, SINGAPORE</div>
  </div>

  <div class="sc-launch-caption">Full site launches in</div>

  <!-- Countdown -->
  <div class="sc-countdown">
    <div class="sc-cd-box">
      <div class="sc-cd-box-top"></div>
      <div class="sc-cd-box-sweep"></div>
      <div class="sc-cd-value" id="sc-cd-days">00</div>
      <div class="sc-cd-label">Days</div>
    </div>
    <div class="sc-cd-box">
      <div class="sc-cd-box-top"></div>
      <div class="sc-cd-box-sweep"></div>
      <div class="sc-cd-value" id="sc-cd-hours">00</div>
      <div class="sc-cd-label">Hours</div>
    </div>
    <div class="sc-cd-box">
      <div class="sc-cd-box-top"></div>
      <div class="sc-cd-box-sweep"></div>
      <div class="sc-cd-value" id="sc-cd-mins">00</div>
      <div class="sc-cd-label">Minutes</div>
    </div>
    <div class="sc-cd-box">
      <div class="sc-cd-box-top"></div>
      <div class="sc-cd-box-sweep"></div>
      <div class="sc-cd-value" id="sc-cd-secs">00</div>
      <div class="sc-cd-label">Seconds</div>
    </div>
  </div>

  <!-- Status row -->
  <div class="sc-status">
    <span style="display:flex;align-items:center;gap:8px;">
      <span class="sc-status-dot"></span>
      <span id="sc-status-text">Countdown live</span>
    </span>
    <span class="sc-status-sep">|</span>
    <span>Launching 1 Aug 2026</span>
  </div>

  <script>
    (function () {
      var TARGET = new Date('2026-08-01T00:00:00+08:00').getTime();
      var pad = function (n) { return String(n).padStart(2, '0'); };

      var elDays = document.getElementById('sc-cd-days');
      var elHours = document.getElementById('sc-cd-hours');
      var elMins = document.getElementById('sc-cd-mins');
      var elSecs = document.getElementById('sc-cd-secs');
      var elStatus = document.getElementById('sc-status-text');
      var elTitleLive = document.getElementById('sc-title-live');
      var elTitleCountdown = document.getElementById('sc-title-countdown');

      function tick() {
        var diff = TARGET - Date.now();
        if (diff <= 0) {
          elDays.textContent = '0';
          elHours.textContent = '00';
          elMins.textContent = '00';
          elSecs.textContent = '00';
          elStatus.textContent = 'Site is live';
          elTitleLive.style.display = '';
          elTitleCountdown.style.display = 'none';
          return;
        }
        var sec = Math.floor(diff / 1000);
        var d = Math.floor(sec / 86400);
        var h = Math.floor((sec % 86400) / 3600);
        var m = Math.floor((sec % 3600) / 60);
        var s = sec % 60;
        elDays.textContent = String(d);
        elHours.textContent = pad(h);
        elMins.textContent = pad(m);
        elSecs.textContent = pad(s);
      }

      tick();
      setInterval(tick, 1000);
    })();
  </script>

</body>
</html>
